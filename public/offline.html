<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline — Tech Googly Partner Program</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #F6F7FB;
            color: #252525;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 36px 28px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(107, 61, 149, 0.08);
            border: 1px solid #e2e8f0;
        }
        .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            background: #f6f0fb;
            color: #6B3D95;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        h1 {
            font-size: 20px;
            margin: 0 0 8px;
            color: #252525;
            font-weight: 800;
        }
        p {
            font-size: 13px;
            color: #64748B;
            line-height: 1.5;
            margin: 0 0 24px;
        }
        .btn {
            display: inline-block;
            background: #6B3D95;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #58307d;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="1" y1="1" x2="23" y2="23"></line>
                <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
                <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
                <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
                <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                <line x1="12" y1="20" x2="12.01" y2="20"></line>
            </svg>
        </div>
        <h1>You are Offline</h1>
        <p>A secure internet connection is required to interact with leads, financial commissions, and portal accounts. Please reconnect to continue.</p>
        <button class="btn" onclick="window.location.reload()">Retry Connection</button>
    </div>
</body>
</html>
